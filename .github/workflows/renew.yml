name: Katabump Auto Renew

on:
  schedule:
    # 每天定点唤醒一次，由脚本内部判断是否满足 4 天间隔
    - cron: '45 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  renew:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6
    
    - name: 🧠 检查时间间隔 (不满 3 天则跳过)
      id: check
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "👋 手动触发，强制执行脚本。"
          echo "run_script=true" >> $GITHUB_ENV
          exit 0
        fi
        
        if [ -f katabump_success.txt ]; then
          LAST_RUN=$(cat katabump_success.txt)
          NOW=$(date +%s)
          DIFF=$(( (NOW - LAST_RUN) / 86400 ))
          if [ $DIFF -lt 3 ]; then
            echo "⏳ 距离上次成功不足 3 天，今天已经执行过了，继续休眠！"
            echo "run_script=false" >> $GITHUB_ENV
            exit 0
          fi
        fi
        
        echo "✅ 达到执行间隔或无记录，即将启动续期..."
        echo "run_script=true" >> $GITHUB_ENV

    - name: ⚙ 设置 Python
      if: env.run_script == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 🛠️ 安装系统依赖和python依赖
      if: env.run_script == 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
        pip install seleniumbase requests
        seleniumbase install chromedriver

    - name: ⚙️ 启动中转代理并执行续期
      if: env.run_script == 'true'
      env:
        KATABUMP_EMAIL: ${{ secrets.KATABUMP_EMAIL }}
        KATABUMP_PASSWORD: ${{ secrets.KATABUMP_PASSWORD }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        PROXY_URL: ${{ secrets.PROXY_URL }}
        PROXY_SERVER: "http://127.0.0.1:8080"
        IS_PROXY: ${{ secrets.PROXY_URL != '' && 'true' || 'false' }}
      run: |
        if [ -n "$PROXY_URL" ]; then
          echo "🔧 正在启动安全的 Gost 本地代理中枢..."
          wget -qO- https://github.com/ginuerzh/gost/releases/download/v2.11.5/gost-linux-amd64-2.11.5.gz | zcat > gost
          chmod +x gost
          ./gost -L http://127.0.0.1:8080 -F "$PROXY_URL" > gost.log 2>&1 &
          sleep 3
        fi
        
        # 运行 Python 脚本并捕获输出日志
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 app.py | tee run_log.txt
        
        # 检测 Python 脚本日志中的“续期成功”标志
        if grep -q "续期成功" run_log.txt; then
          echo "🎉 检测到真实的续期成功标志！"
          echo "REAL_SUCCESS=true" >> $GITHUB_ENV
        else
          echo "ℹ️ 本次运行未发生真实续期（可能还没到时间，或发生错误）。"
          echo "REAL_SUCCESS=false" >> $GITHUB_ENV
        fi

    - name: 💾 记录真实成功时间并推送至仓库
      if: success() && env.run_script == 'true' && env.REAL_SUCCESS == 'true'
      run: |
        date +%s > katabump_success.txt
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add katabump_success.txt
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 记录 KataBump 真实续期时间 [skip ci]" && git push)
        echo "🎉 真正的续期时间点已存档！接下来 4 天将自动休眠。"

    - name: 📤 上传异常截图存档
      if: always() && env.run_script == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: katabump-screenshots
        path: "*.png"
        if-no-files-found: ignore
        retention-days: 3

    - name: 🧹 清理旧的工作流运行记录
      if: always()
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        delete_workflow_pattern: ${{ github.workflow }}
        retain_days: 0
        keep_minimum_runs: 5
